; PHP overrides for the Vercel runtime.
;
; This file is consumed during the build and is not deployed as an asset.

; Uploads must clear config/payments.php `max_kilobytes` (4096 KB) and the
; poster rule's 4 MB. Headroom is deliberate: when post_max_size is the lower
; of the two, PHP discards the request body and Laravel sees an empty request,
; producing a confusing "field required" error instead of a size error.
;
; Vercel caps a function request body at 4.5 MB regardless of what is set
; here, so a file near 4 MB can still be rejected by the platform with a 413
; before PHP is reached. Lower the application limits if that matters.
upload_max_filesize = 8M
post_max_size = 10M

; Only /tmp is writable.
upload_tmp_dir = /tmp
sys_temp_dir = /tmp

; Errors belong in the function log, never in the HTTP response: a stack
; trace rendered to a participant leaks paths and configuration.
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Comfortably above Laravel's needs while well under the function's memory.
memory_limit = 256M

; Dates are rendered by the application using APP_TIMEZONE; UTC here keeps PHP
; itself from applying a second, different offset.
date.timezone = UTC
