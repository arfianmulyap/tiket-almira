; Production PHP settings for Almira Tiket Event.
; Loaded after the image defaults, so these win.

memory_limit = 256M
max_execution_time = 60

; The application rejects uploads over 4 MB itself; leave headroom so PHP
; returns the application's validation error instead of silently dropping the
; file at the post_max_size boundary.
upload_max_filesize = 8M
post_max_size = 10M
max_file_uploads = 10

expose_php = Off
display_errors = Off
log_errors = On

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.jit = off

date.timezone = Asia/Jakarta
